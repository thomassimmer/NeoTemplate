services:
  db:
    container_name: db
    image: postgres:14
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./backend/.env
    ports:
      - "5434:5434"
    command: -p 5434
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neotemplate_db -p 5434"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: backend
    image: backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    command: >
      bash -c "python manage.py makemigrations
      && python manage.py migrate
      && python manage.py collectstatic --no-input
      && python -m uvicorn core.asgi:application --reload --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    build:
      context: ./backend
    hostname: backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/usr/src/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/admin/ | grep -qE '(200|302|301|401)' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    container_name: frontend
    image: frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
    build:
      context: ./frontend
      target: runner-dev
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
