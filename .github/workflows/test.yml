name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test environment file
        working-directory: ./backend
        run: |
          cat > .env << EOF
          SECRET_KEY=${{ secrets.SECRET_KEY || 'test-secret-key-for-ci' }}
          DEBUG=0
          FRONTEND_HOST=http://localhost:3000
          SQL_ENGINE=django.db.backends.postgresql
          POSTGRES_DB=neotemplate_test
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_HOST=db
          POSTGRES_PORT=5434
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY || 'test-jwt-secret-key-for-ci' }}
          EMAIL_HOST=
          EMAIL_HOST_USER=
          EMAIL_HOST_PASSWORD=
          EOF

      - name: Build and start services
        run: |
          docker compose up -d db
          docker compose build backend

      - name: Wait for database
        run: |
          timeout 30 bash -c 'until docker compose exec -T db pg_isready -U postgres -p 5434; do sleep 1; done'

      - name: Run tests
        run: |
          docker compose run --rm backend python manage.py test --verbosity=2
